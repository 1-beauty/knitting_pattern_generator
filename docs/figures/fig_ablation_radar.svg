<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560">
  <style>
    .title { font-family: Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #111827; }
    .label { font-family: Arial, sans-serif; font-size: 13px; fill: #374151; }
    .small { font-family: Arial, sans-serif; font-size: 12px; fill: #4b5563; }
    .grid { fill: none; stroke: #d1d5db; stroke-width: 1; }
  </style>
  <rect width="760" height="560" fill="#ffffff"/>
  <text x="38" y="42" class="title">Normalized Constraint Quality Indicators</text>
  <text x="38" y="68" class="small">Scores are normalized to the best observed value in this stress test; higher is better.</text>
  <g transform="translate(380,285)">
    <polygon class="grid" points="0,-160 152,-49 94,129 -94,129 -152,-49"/>
    <polygon class="grid" points="0,-120 114,-37 71,97 -71,97 -114,-37"/>
    <polygon class="grid" points="0,-80 76,-25 47,65 -47,65 -76,-25"/>
    <polygon class="grid" points="0,-40 38,-12 24,32 -24,32 -38,-12"/>
    <line x1="0" y1="0" x2="0" y2="-170" stroke="#cbd5e1"/>
    <line x1="0" y1="0" x2="162" y2="-53" stroke="#cbd5e1"/>
    <line x1="0" y1="0" x2="100" y2="138" stroke="#cbd5e1"/>
    <line x1="0" y1="0" x2="-100" y2="138" stroke="#cbd5e1"/>
    <line x1="0" y1="0" x2="-162" y2="-53" stroke="#cbd5e1"/>

    <text x="0" y="-188" text-anchor="middle" class="label">Low tension</text>
    <text x="186" y="-58" text-anchor="middle" class="label">Pair integrity</text>
    <text x="125" y="160" text-anchor="middle" class="label">No overflow</text>
    <text x="-125" y="160" text-anchor="middle" class="label">Moderate density</text>
    <text x="-186" y="-58" text-anchor="middle" class="label">Hard legality</text>

    <polygon points="0,-160 152,-49 94,129 -94,129 -152,-49" fill="#2563eb" fill-opacity="0.18" stroke="#2563eb" stroke-width="3"/>
    <polygon points="0,-47 152,-49 94,129 -6,8 -152,-49" fill="#ef4444" fill-opacity="0.18" stroke="#ef4444" stroke-width="3"/>
    <polygon points="0,-100 152,-49 94,129 -52,72 -152,-49" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-width="3"/>
    <polygon points="0,-76 152,-49 94,129 -70,96 -152,-49" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b" stroke-width="3"/>
  </g>
  <g transform="translate(42,490)">
    <rect x="0" y="-12" width="16" height="16" fill="#2563eb"/><text x="24" y="1" class="small">Full</text>
    <rect x="85" y="-12" width="16" height="16" fill="#ef4444"/><text x="109" y="1" class="small">No repair</text>
    <rect x="200" y="-12" width="16" height="16" fill="#10b981"/><text x="224" y="1" class="small">No refinement</text>
    <rect x="340" y="-12" width="16" height="16" fill="#f59e0b"/><text x="364" y="1" class="small">No aesthetic</text>
  </g>
</svg>
