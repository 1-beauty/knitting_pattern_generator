<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2f3a45"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .h { font: 700 20px Arial, "Microsoft YaHei", sans-serif; fill: #1f2933; }
      .t { font: 15px Arial, "Microsoft YaHei", sans-serif; fill: #344054; }
      .small { font: 13px Arial, "Microsoft YaHei", sans-serif; fill: #475467; }
      .box { fill: #ffffff; stroke: #40566b; stroke-width: 2; rx: 8; }
      .soft { fill: #eef6ff; stroke: #3b82b6; stroke-width: 2; rx: 8; }
      .green { fill: #edf8f1; stroke: #3f8f5f; stroke-width: 2; rx: 8; }
      .amber { fill: #fff6df; stroke: #c88719; stroke-width: 2; rx: 8; }
      .gray { fill: #f4f6f8; stroke: #7b8794; stroke-width: 2; rx: 8; }
      .arrow { stroke: #2f3a45; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #7b8794; stroke-width: 1.8; stroke-dasharray: 6 5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="42" y="48" class="title">语义驱动横机针织组织生成与结构感知仿真验证总体框架</text>

  <rect x="42" y="92" width="250" height="150" class="gray"/>
  <text x="66" y="128" class="h">输入</text>
  <text x="66" y="164" class="t">自然语言设计描述</text>
  <text x="66" y="194" class="small">例：圆形内部波浪吊目</text>
  <text x="66" y="218" class="small">外部矩形边框，背景稀疏网眼</text>

  <rect x="370" y="78" width="360" height="180" class="soft"/>
  <text x="398" y="114" class="h">第一阶段：语义到组织色码图</text>
  <text x="398" y="150" class="t">层次化结构计划</text>
  <text x="398" y="178" class="t">工艺实现与稀疏事件规划</text>
  <text x="398" y="206" class="t">动作网格构建与规则自修复</text>
  <text x="398" y="234" class="small">输出内部 15 色动作图 P</text>

  <rect x="800" y="120" width="330" height="116" class="amber"/>
  <text x="826" y="154" class="h">第二阶段：结构感知仿真</text>
  <text x="826" y="184" class="t">内部色码图 P → 针织效果图 S</text>
  <text x="826" y="212" class="small">边界、纹理、层级可视化验证</text>

  <rect x="238" y="378" width="266" height="144" class="box"/>
  <text x="266" y="413" class="h">难点一</text>
  <text x="266" y="446" class="t">自然语言语义难以</text>
  <text x="266" y="474" class="t">转化为针织结构语义</text>

  <rect x="516" y="378" width="266" height="144" class="box"/>
  <text x="544" y="413" class="h">难点二</text>
  <text x="544" y="446" class="t">生成式方法缺少</text>
  <text x="544" y="474" class="t">动作级制造约束</text>

  <rect x="794" y="378" width="266" height="144" class="box"/>
  <text x="822" y="413" class="h">难点三</text>
  <text x="822" y="446" class="t">生成结果缺少</text>
  <text x="822" y="474" class="t">结构感知验证闭环</text>

  <text x="270" y="566" class="t">层次化 PatternPlan</text>
  <text x="552" y="566" class="t">规则约束与自修复</text>
  <text x="832" y="566" class="t">结构感知仿真验证</text>

  <path d="M292 167 L365 167" class="arrow"/>
  <path d="M730 168 L795 178" class="arrow"/>
  <path d="M550 258 L550 330 L650 330 L650 373" class="dash"/>
  <path d="M965 236 L965 360 L927 373" class="dash"/>
  <path d="M545 258 L545 330 L371 330 L371 373" class="dash"/>
</svg>
